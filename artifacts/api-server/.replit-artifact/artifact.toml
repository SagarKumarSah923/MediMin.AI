kind = "api"
previewPath = "/api"
title = "MediMin Spring API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd ../.. && bash services/medimin-spring/run-dev.sh"

[services.production]

[services.production.build]
args = ["mvn", "-f", "services/medimin-spring/pom.xml", "clean", "package", "-DskipTests"]

[services.production.build.env]
CI = "true"

[services.production.run]
args = ["bash", "-lc", "cd ../.. && exec bash services/medimin-spring/run-dev.sh"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
